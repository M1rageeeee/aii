<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI Chat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,Roboto,sans-serif; background:#0f1115; color:#e8e8e8;
         height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 16px; background:#171a21; border-bottom:1px solid #262b36;
           font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px; }
  header::before { content:''; width:9px; height:9px; border-radius:50%;
                   background:#3ddc84; box-shadow:0 0 8px #3ddc84; }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:11px 14px; border-radius:16px; font-size:15px;
         line-height:1.45; word-wrap:break-word; white-space:pre-wrap; animation:in .18s ease; }
  @keyframes in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .user { align-self:flex-end; background:#2d6cf6; color:#fff; border-bottom-right-radius:4px; }
  .ai   { align-self:flex-start; background:#1e232d; border-bottom-left-radius:4px; }
  .err  { align-self:center; background:#3a1c1c; color:#ff8a8a; font-size:13px; }
  form { display:flex; gap:8px; padding:10px; background:#171a21;
         border-top:1px solid #262b36; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  textarea { flex:1; resize:none; background:#0f1115; color:#e8e8e8; border:1px solid #2a3040;
             border-radius:20px; padding:11px 16px; font-size:15px; font-family:inherit;
             max-height:110px; outline:none; }
  textarea:focus { border-color:#2d6cf6; }
  button { width:44px; height:44px; flex-shrink:0; border:none; border-radius:50%;
           background:#2d6cf6; color:#fff; font-size:18px; cursor:pointer; }
  button:disabled { background:#2a3040; }
</style>
</head>
<body>
<header>DeepSeek Chat</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Сообщение..." required></textarea>
  <button id="send" type="submit">➤</button>
</form>

<script>
const API_URL = '/api/chat';   // ВАЖНО: ключ НЕ здесь, а на сервере
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const form = document.getElementById('form');
const sendBtn = document.getElementById('send');
const history = [];            // [{role, content}]

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  history.push({ role:'user', content:text });
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;

  const bubble = addMsg('…', 'ai');
  let answer = '';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      answer += dec.decode(value, { stream:true });
      bubble.textContent = answer;
      chat.scrollTop = chat.scrollHeight;
    }
    history.push({ role:'assistant', content:answer });
  } catch (err) {
    bubble.className = 'msg err';
    bubble.textContent = 'Ошибка: ' + err.message;
    history.pop();
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
